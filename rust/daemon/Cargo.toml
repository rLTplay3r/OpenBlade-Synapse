[package]
name = "daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
zbus = "5"
obcore = { path = "../obcore" }
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2.191"
serde_json = "1.0.154"
ureq = "3.5.2"
png = "0.18.1"
indexmap = { version = "2.14.2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }

[[bin]]
name = "OpenBlade-Synapse"
path = "src/main.rs"
