[package]
name = "gui"
version = "0.1.0"
edition = "2024"

[dependencies]
obcore = { path = "../obcore" }
cxx = "1.0.205"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[build-dependencies]
cxx-qt-build = "0.10.0"

[[bin]]
name = "openblade-synapse-gui"
path = "src/main.rs"
